<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Portal Pemangan SMKN 1 Jakarta</title>
  <link rel="icon" href="../img/image2.png" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <main>
    <div class="box">
      <div class="inner-box">
        <div class="forms-wrap">
          <!-- Sign In Form -->
          <form action="#" autocomplete="off" class="sign-in-form" id="signInForm">
            <div class="logo">
              <img src="../img/logo.png" alt="Pemangan SMKN 1" />
              <h4>Pemangan SMKN 1</h4>
            </div>

            <div class="heading">
              <h2>Masuk Akun</h2>
              <h6>Belum punya akun?</h6>
              <a href="#" class="toggle">Daftar Disini</a>
            </div>

            <div class="actual-form">
              <div class="input-wrap">
                <input type="text" minlength="3" class="input-field" id="loginNis" autocomplete="off" required />
                <label for="loginNis">NIS / NIP / Username</label>
              </div>

              <div class="input-wrap">
                <input type="password" minlength="3" class="input-field" id="loginPassword" autocomplete="off" required />
                <label for="loginPassword">Kata Sandi</label>
              </div>

              <button type="submit" class="sign-btn">Masuk Sekarang</button>

              <div class="demo-accounts-hint">
                <p>Akun Demo Cepat:</p>
                <div class="demo-pills">
                  <button type="button" class="demo-pill" data-nis="102144" data-pass="123">Siswa (102144)</button>
                  <button type="button" class="demo-pill" data-nis="19800101" data-pass="guru">Guru (19800101)</button>
                  <button type="button" class="demo-pill" data-nis="admin" data-pass="admin">Admin</button>
                </div>
              </div>

              <p class="text">
                Kembali ke <a href="../index.html">Beranda Pemangan</a>
              </p>
            </div>
          </form>

          <!-- Sign Up Form -->
          <form action="#" autocomplete="off" class="sign-up-form" id="signUpForm">
            <div class="logo">
              <img src="../img/logo.png" alt="Pemangan SMKN 1" />
              <h4>Pemangan SMKN 1</h4>
            </div>

            <div class="heading">
              <h2>Daftar Akun</h2>
              <h6>Sudah punya akun?</h6>
              <a href="#" class="toggle">Masuk Disini</a>
            </div>

            <div class="actual-form">
              <div class="input-wrap">
                <input type="text" class="input-field" id="regName" autocomplete="off" required />
                <label for="regName">Nama Lengkap</label>
              </div>

              <div class="input-wrap">
                <input type="text" class="input-field" id="regNis" autocomplete="off" required />
                <label for="regNis">NIS / NIP</label>
              </div>

              <div class="input-wrap">
                <input type="text" class="input-field" id="regClass" autocomplete="off" required />
                <label for="regClass">Kelas / Unit (Contoh: XI SIJA)</label>
              </div>

              <div class="input-wrap">
                <input type="password" class="input-field" id="regPassword" autocomplete="off" required />
                <label for="regPassword">Kata Sandi</label>
              </div>

              <button type="submit" class="sign-btn">Buat Akun Baru</button>

              <p class="text">
                Kembali ke <a href="../index.html">Beranda Pemangan</a>
              </p>
            </div>
          </form>
        </div>

        <!-- Carousel Area -->
        <div class="carousel">
          <div class="images-wrapper">
            <img src="../img/logo.png" class="image img-1 show" alt="SMKN 1 Jakarta" />
            <img src="../img/image1.png" class="image img-2" alt="Lab SIJA" />
            <img src="../img/image3.png" class="image img-3" alt="Teater SMKN 1" />
          </div>

          <div class="text-slider">
            <div class="text-wrap">
              <div class="text-group">
                <h2>SMK Negeri 1 Jakarta</h2>
                <h2>Laboratorium Komputer & SIJA</h2>
                <h2>Auditorium & Teater</h2>
              </div>
            </div>

            <div class="bullets">
              <span class="active" data-value="1"></span>
              <span data-value="2"></span>
              <span data-value="3"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="loginToast" class="login-toast"></div>

  <!-- Scripts -->
  <script src="../js/store.js"></script>
  <script src="login.js"></script>
</body>

</html>
